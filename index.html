<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html">
    <title>main - HSP3Dish</title>
    <style>
      body {
        font-family: arial;
        margin: 0;
        padding: 0;
      }

      .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
      div.emscripten { text-align: center; }      
      /*div.emscripten_border { border: 1px solid black; }*/ /* ezlocal-dish-js */
      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten { border: 0px none; }

      #emscripten_logo {
        display: inline-block;
        margin: 0;
      }

      .spinner {
        height: 30px;
        width: 30px;
        margin: 0;
        margin-top: 20px;
        margin-left: 20px;
        display: inline-block;
        vertical-align: top;

        -webkit-animation: rotation .8s linear infinite;
        -moz-animation: rotation .8s linear infinite;
        -o-animation: rotation .8s linear infinite;
        animation: rotation 0.8s linear infinite;

        border-left: 5px solid rgb(235, 235, 235);
        border-right: 5px solid rgb(235, 235, 235);
        border-bottom: 5px solid rgb(235, 235, 235);
        border-top: 5px solid rgb(120, 120, 120);
        
        border-radius: 100%;
        background-color: rgb(189, 215, 46);
      }

      @-webkit-keyframes rotation {
        from {-webkit-transform: rotate(0deg);}
        to {-webkit-transform: rotate(360deg);}
      }
      @-moz-keyframes rotation {
        from {-moz-transform: rotate(0deg);}
        to {-moz-transform: rotate(360deg);}
      }
      @-o-keyframes rotation {
        from {-o-transform: rotate(0deg);}
        to {-o-transform: rotate(360deg);}
      }
      @keyframes rotation {
        from {transform: rotate(0deg);}
        to {transform: rotate(360deg);}
      }

      #status {
        display: inline-block;
        vertical-align: top;
        margin-top: 30px;
        margin-left: 20px;
        font-weight: bold;
        color: rgb(120, 120, 120);
      }

      #progress {
        height: 20px;
        width: 30px;
      }

      #controls {
        display: inline-block;
        float: right;
        vertical-align: top;
        margin-top: 30px;
        margin-right: 20px;
      }

      #output {
        width: 98%; /* ezlocal-dish-js */
        height: 200px;
        margin: 0 auto;
        margin-top: 10px;
        display: block;
        background-color: black;
        color: white;
        font-family: 'Lucida Console', Monaco, monospace;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div class="spinner" id='spinner'></div>
    <div class="emscripten" id="status">Downloading...</div>

    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden></progress>
    </div>

    
    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>
    <textarea id="output" rows="8" style="display:none;"></textarea> <!-- ezlocal-dish-js -->
    <button style="width: 240px; height: 50px; display:none;" id="btn_flg">センサーを許可する</button> <!-- ezlocal-dish-js -->

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var sensor_button = 0;

      var Module = {
        INITIAL_MEMORY: 209715200,
        preRun: [],
        postRun: [],
        print: (function() {
          var element = document.getElementById('output');
          if (element) element.value = ''; // clear browser cache
          return function(text) {
            text = Array.prototype.slice.call(arguments).join(' ');
            // These replacements are necessary if you render to raw HTML
            //text = text.replace(/&/g, "&amp;");
            //text = text.replace(/</g, "&lt;");
            //text = text.replace(/>/g, "&gt;");
            //text = text.replace('\n', '<br>', 'g');
            console.log(text);
            if (element) {
              element.value += text + "\n";
              element.scrollTop = element.scrollHeight; // focus on bottom
              if (text.includes('#Error')) element.style.display = "";  // ezlocal-dish-js
            }
          };
        })(),
        printErr: function(text) {
          text = Array.prototype.slice.call(arguments).join(' ');
          if (0) { // XXX disabled for safety typeof dump == 'function') {
            dump(text + '\n'); // fast, straight to the real console
          } else {
            console.error(text);
          }
        },
        canvas: document.getElementById('canvas'),
        setStatus: function(text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Date.now() < 30) return; // if this is a progress update, skip it if too soon
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2])*100;
            progressElement.max = parseInt(m[4])*100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
            if (!text) spinnerElement.style.display = 'none';
            if (!text) statusElement.style.display = 'none';  // ezlocal-dish-js
          }
          statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        },
        arguments: ["main.ax"]
      };
      Module.setStatus('Downloading...');

/* block.js */

var Module;
if (typeof Module === 'undefined') Module = eval('(function() { try { return Module || {} } catch(e) { return {} } })()');
if (!Module.expectedDataFileDownloads) {
  Module.expectedDataFileDownloads = 0;
  Module.finishedDataFileDownloads = 0;
}
Module.expectedDataFileDownloads++;
(function() {

    var PACKAGE_PATH;
    if (typeof window === 'object') {
      PACKAGE_PATH = window['encodeURIComponent'](window.location.pathname.toString().substring(0, window.location.pathname.toString().lastIndexOf('/')) + '/');
    } else {
      // worker
      PACKAGE_PATH = encodeURIComponent(location.pathname.toString().substring(0, location.pathname.toString().lastIndexOf('/')) + '/');
    }
    var PACKAGE_NAME = 'main.data';
    var REMOTE_PACKAGE_NAME = (Module['filePackagePrefixURL'] || '') + 'main.data';
    var REMOTE_PACKAGE_SIZE = 291553;
    var PACKAGE_UUID = '51f84d03-0c74-4552-ac13-924e79e76977';
  
    function fetchRemotePackage(packageName, packageSize, callback, errback) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', packageName, true);
      xhr.responseType = 'arraybuffer';
      xhr.onprogress = function(event) {
        var url = packageName;
        var size = packageSize;
        if (event.total) size = event.total;
        if (event.loaded) {
          if (!xhr.addedTotal) {
            xhr.addedTotal = true;
            if (!Module.dataFileDownloads) Module.dataFileDownloads = {};
            Module.dataFileDownloads[url] = {
              loaded: event.loaded,
              total: size
            };
          } else {
            Module.dataFileDownloads[url].loaded = event.loaded;
          }
          var total = 0;
          var loaded = 0;
          var num = 0;
          for (var download in Module.dataFileDownloads) {
          var data = Module.dataFileDownloads[download];
            total += data.total;
            loaded += data.loaded;
            num++;
          }
          total = Math.ceil(total * Module.expectedDataFileDownloads/num);
          if (Module['setStatus']) Module['setStatus']('Downloading data... (' + loaded + '/' + total + ')');
        } else if (!Module.dataFileDownloads) {
          if (Module['setStatus']) Module['setStatus']('Downloading data...');
        }
      };
      xhr.onload = function(event) {
        var packageData = xhr.response;
        callback(packageData);
      };
      xhr.send(null);
    };

    function handleError(error) {
      console.error('package error:', error);
    };
  
      var fetched = null, fetchedCallback = null;
      fetchRemotePackage(REMOTE_PACKAGE_NAME, REMOTE_PACKAGE_SIZE, function(data) {
        if (fetchedCallback) {
          fetchedCallback(data);
          fetchedCallback = null;
        } else {
          fetched = data;
        }
      }, handleError);
    
  function runWithFS() {

function assert(check, msg) {
  if (!check) throw msg + new Error().stack;
}



    function DataRequest(start, end, crunched, audio) {
      this.start = start;
      this.end = end;
      this.crunched = crunched;
      this.audio = audio;
    }
    DataRequest.prototype = {
      requests: {},
      open: function(mode, name) {
        this.name = name;
        this.requests[name] = this;
        Module['addRunDependency']('fp ' + this.name);
      },
      send: function() {},
      onload: function() {
        var byteArray = this.byteArray.subarray(this.start, this.end);

          this.finish(byteArray);

      },
      finish: function(byteArray) {
        var that = this;
        Module['FS_createPreloadedFile'](this.name, null, byteArray, true, true, function() {
          Module['removeRunDependency']('fp ' + that.name);
        }, function() {
          if (that.audio) {
            Module['removeRunDependency']('fp ' + that.name); // workaround for chromium bug 124926 (still no audio with this, but at least we don't hang)
          } else {
            Module.printErr('Preloading file ' + that.name + ' failed');
          }
        }, false, true); // canOwn this data in the filesystem, it is a slide into the heap that will never change
        this.requests[this.name] = null;
      },
    };

      new DataRequest(0, 3070, 0, 0).open('GET', 'main.ax');
      new DataRequest(3070, 16737, 0, 0).open('GET', 'pic00.png');
      new DataRequest(16737, 43453, 0, 0).open('GET', 'se_00.wav');
      new DataRequest(43453, 158971, 0, 0).open('GET', 'se_01.wav');
      new DataRequest(158971, 291553, 0, 0).open('GET', 'se_02.wav');


    function processPackageData(arrayBuffer) {
      Module.finishedDataFileDownloads++;
      assert(arrayBuffer, 'Loading data file failed.');
      var byteArray = new Uint8Array(arrayBuffer);
      var curr;
      
      // copy the entire loaded file into a spot in the heap. Files will refer to slices in that. They cannot be freed though.
      var ptr = Module['_malloc'](byteArray.length);
      Module['HEAPU8'].set(byteArray, ptr);
      DataRequest.prototype.byteArray = Module['HEAPU8'].subarray(ptr, ptr+byteArray.length);

          DataRequest.prototype.requests["main.ax"].onload();
          DataRequest.prototype.requests["pic00.png"].onload();
          DataRequest.prototype.requests["se_00.wav"].onload();
          DataRequest.prototype.requests["se_01.wav"].onload();
          DataRequest.prototype.requests["se_02.wav"].onload();

          Module['removeRunDependency']('datafile_main.data');

    };
    Module['addRunDependency']('datafile_main.data');
  
    if (!Module.preloadResults) Module.preloadResults = {};
  
      Module.preloadResults[PACKAGE_NAME] = {fromCache: false};
      if (fetched) {
        processPackageData(fetched);
        fetched = null;
      } else {
        fetchedCallback = processPackageData;
      }
    
        ENV.HSP_WX = "512";//スクリプトの動作解像度
        ENV.HSP_WY = "256";
        ENV.HSP_SX = "512";//表示解像度
        ENV.HSP_SY = "256";
        ENV.HSP_AUTOSCALE = "0";//スケーリングモード
        ENV.HSP_FPS = "0";//フレームレート
        ENV.HSP_LIMIT_STEP = "15000";//ブラウザに処理を返すまでの実行ステップ数
        if (navigator.userAgent.match(/iPhone|Android.+Mobile/)) {  // ezlocal-dish-js
        	if (navigator.userAgent.match(/iPhone/)) {
        		const meta = document.createElement('meta');
        		meta.name = 'viewport';
        		meta.content = 'width='+ window.innerWidth +', viewport-fit=cover';
        		document.getElementsByTagName('head')[0].appendChild(meta);
        	}
        	const newDiv = document.createElement('div');
        	newDiv.style.width = '100vw';
        	newDiv.style.height = '55vh';
        	const referenceNode = document.getElementById('canvas');
        	referenceNode.parentNode.insertBefore(newDiv, referenceNode);
        	const cloneDiv = newDiv.cloneNode(true);
        	cloneDiv.id = 'oridev';
        	if( !navigator.userAgent.match(/iPhone.+\(KHTML, like Gecko\) Version\/.+Mobile.+Safari/) ){
        		if (getComputedStyle(document.body).backgroundColor === 'rgb(0, 0, 0)') {
        			cloneDiv.style.color = '#c0c0c0';
        		}
        		cloneDiv.style.fontSize = '3em';
        		cloneDiv.style.textAlign = 'center';
        		cloneDiv.innerHTML = '<br><br><b>- Fit Landscape -</b><br>&#8645;スクロールしてURLバーが消えたら<br><span style="opacity:.5;">&#x1F4F1;</span> → <span style="display: inline-block;transform: rotate(90deg);">&#x1F4F1;</span><br>デバイスを回転させてください';
        	}
        	document.body.appendChild(cloneDiv);
        	const loovh = document.getElementById('oridev').clientHeight * 2;
        	function FitCanvasToScreen() {
        		const gameAspect = ENV.HSP_WX / ENV.HSP_WY;
        		const dispAspect = window.innerWidth / window.innerHeight;
        		if(gameAspect >= dispAspect){
        			canvas.style.width = String(Math.round(window.innerWidth)) + 'px';
        			canvas.style.height = String(Math.round(window.innerWidth / gameAspect)) + 'px';
        		}else {
        			const gameH = window.innerWidth / dispAspect + 1;
        			const gameW = gameH * gameAspect;
        			canvas.style.width = String(Math.round(gameW)) + 'px';
        			canvas.style.height = String(Math.round(gameH)) + 'px';
        		}
        	}
        	function ScrollCenterCanvas() {
        		setTimeout(() => {
        			FitCanvasToScreen();
        			setTimeout(() => {
        				document.getElementById('canvas').scrollIntoView({ behavior: 'smooth', block: 'center' });
        			}, 500);
        		}, 100);
        	}
        	window.addEventListener('orientationchange', ScrollCenterCanvas);
        	ScrollCenterCanvas();
        	const sx = window.innerWidth;
        	const sy = sx / ENV.HSP_WX * ENV.HSP_WY;
        	if (navigator.userAgent.match(/iPhone/)) {
        		ENV.HSP_SX = String(sx);
        		ENV.HSP_SY = String(Math.round(sx*screen.width/screen.height));
        	}else {
        		const statusNavigationBar = window.innerWidth * screen.height / screen.width - loovh;
        		const newDiv_s = document.createElement('div');
        		newDiv_s.id = 'oridev_s';
        		newDiv_s.style.height = '100svh';
        		document.body.appendChild(newDiv_s);
        		const urlBar = (loovh - newDiv_s.clientHeight);
        		newDiv_s.remove();
        		let _SY = sx * screen.width / screen.height - statusNavigationBar * screen.width / screen.height / window.devicePixelRatio;
        		if (statusNavigationBar > urlBar * 1.25)
        			_SY += urlBar / window.devicePixelRatio;
        		ENV.HSP_SX = String(sx);
        		ENV.HSP_SY = String(Math.round(_SY));
        	}
        	ENV.HSP_WX = String(Math.round(ENV.HSP_SX * 256 / ENV.HSP_SY));
        	ENV.HSP_WY = String(256);
        	FitCanvasToScreen();
        	const border = document.querySelector('.emscripten_border');
        	if (border) {
        		border.addEventListener('touchmove', (e) => {
        			if (e.target.closest('canvas')) return;
        			e.preventDefault();
        		}, { passive: false });
        	}
        }
        ENV.HSP_SENSOR = String( sensor_button );//センサーを使用する

  }
  if (Module['calledRun']) {
    runWithFS();
  } else {
    if (!Module['preRun']) Module['preRun'] = [];
    Module["preRun"].push(runWithFS); // FS is not initialized yet, wait for it
  }

})();


				var fixAudioContext = function (e) {
				        SDL.openAudioContext();
					var context = SDL.audioContext;
					if (context) {
						// Create empty buffer
						var buffer = context.createBuffer(1, 1, 22050);
						var source = context.createBufferSource();
						source.buffer = buffer;
						// Connect to output (speakers)
						source.connect(context.destination);
						// Play sound
						if (source.start) {
							source.start(0);
						} else if (source.play) {
							source.play(0);
						} else if (source.noteOn) {
							source.noteOn(0);
						}
						//const soundEffect = new Audio();
						//soundEffect.play();
					      console.log('audio unlock:');
					}

					var target = document;
					//var target = document.getElementById('canvas');

					// Remove events
					target.removeEventListener('touchstart', fixAudioContext);
					target.removeEventListener('touchend', fixAudioContext);
					target.removeEventListener('mousedown', fixAudioContext);
				};
				var addpermission = function (e) {
				    if ( typeof( DeviceMotionEvent ) !== "undefined" && typeof( DeviceMotionEvent.requestPermission ) === "function" ) {
				        // (optional) Do something before API request prompt.
				        DeviceMotionEvent.requestPermission()
			            .then( response => {
			          	  // (optional) Do something after API prompt dismissed.
				            if ( response == "granted" ) {
				                    // do something for 'e' here.
				            }
				        })
			            .catch( console.error )
				    }
				    //target.removeEventListener("click", addpermission);
				}

				//var target = document.getElementById('canvas');
				var target = document;
				// iOS 6-8
				target.addEventListener('touchstart', fixAudioContext);
				// iOS 9
				target.addEventListener('touchend', fixAudioContext);
				target.addEventListener('mousedown', fixAudioContext);

				if ( sensor_button == 0 ) {
					btn_flg.style.display = 'none';
				} else {
				    const btn_flg = document.getElementById('btn_flg'); //for iOS
					if(window.DeviceMotionEvent){
					 if(DeviceMotionEvent.requestPermission){
					  btn_flg.addEventListener( "click", addpermission );
					 }else{
					  btn_flg.style.display = 'none';
					 }
					}
				}

    </script>
